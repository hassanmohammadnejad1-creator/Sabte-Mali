<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>مدیریت مخارج</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#3a1f0c;font-family:Vazirmatn,Tahoma,sans-serif;color:#fff;display:flex;justify-content:center}
.app{width:100%;max-width:480px;padding:0 0 10px;background:repeating-linear-gradient(95deg,#7b4a22 0 6px,#6e4120 6px 11px,#80502a 11px 17px),#6e4120;display:flex;flex-direction:column;gap:8px}
img{display:block;width:100%}
.head{border-bottom:3px solid #c98f2e}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 6px}
.card{border-radius:16px;border:3px solid #f2a93b;padding:7px 8px 6px;position:relative;height:118px;box-shadow:inset 0 3px 5px #fff7,inset 0 -4px 8px #0006,0 3px 6px #0009;text-align:center;overflow:hidden}
.card small{display:block;font-size:13px;font-weight:900;text-shadow:0 2px 2px #0009;border-bottom:1px solid #fff3;padding-bottom:3px}
.card b{display:block;font-size:21px;font-weight:900;margin-top:6px;direction:ltr;text-shadow:0 2px 3px #000a;text-align:right;line-height:1.1}
.card em{position:absolute;left:8px;bottom:6px;font-style:normal;font-size:14px;font-weight:900;text-shadow:0 2px 2px #0009}
.card img{position:absolute;right:2px;bottom:2px;width:46px;border-radius:8px}
.r{background:linear-gradient(#ee2c2c,#8e0b10)}.g{background:linear-gradient(#37c637,#0a6a16)}.bl{background:linear-gradient(#2c6af0,#0a2b94)}
.panel{margin:6px 6px 0;border-radius:20px;border:3px solid #d29a38;background:linear-gradient(#1a3a86,#0e2459);padding:42px 8px 8px;position:relative;box-shadow:inset 0 0 12px #000a}
.rib{position:absolute;top:-14px;left:50%;width:76%;transform:translateX(-50%)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);height:178px;background:repeating-linear-gradient(#0000 0 34px,#5f86e633 34px 35px)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border-left:1px solid #5f86e622;font-size:13px;font-weight:900;text-shadow:0 2px 2px #000}
.bar{width:68%;border-radius:7px 7px 3px 3px;margin-top:2px;min-height:8px;border:2px solid #fff7;box-shadow:inset 0 5px 6px #fff6,inset 0 -5px 6px #0004}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:4px}
.days div{background:#1c3a86;border:1px solid #3a5fc0;border-radius:8px;text-align:center;font-size:11px;font-weight:900;padding:4px 0}
.row{display:grid;gap:8px;padding:0 6px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:repeat(3,1fr)}
.row img{border-radius:20px;cursor:pointer;box-shadow:0 3px 6px #000a}.row img:active,.foot:active{transform:scale(.96)}
.foot{margin:0 6px;border-radius:30px}
.sheet{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:5}.sheet.on{display:flex}
.pn{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:linear-gradient(#1a3a86,#0e2459);border:3px solid #d29a38;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.pn h2{margin:0 0 12px;color:#ffc933}
input,select,textarea{width:100%;font-family:inherit;font-size:16px;padding:12px;margin-bottom:10px;border-radius:12px;border:2px solid #d29a38;background:#0a1a44;color:#fff}
.li{display:flex;justify-content:space-between;align-items:center;background:#0a1a44;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:14px;gap:8px}.li small{opacity:.7;display:block}
.x{background:none;border:0;color:#ff7a7a;font-size:18px}.neg{color:#ff8a8a}.pos{color:#8aff8a}
.btn{font-family:inherit;font-weight:900;color:#fff;width:100%;height:48px;border-radius:14px;border:2px solid #ffd27a;font-size:17px;margin-top:6px;text-shadow:0 2px 2px #0008}
.bar2{height:9px;border-radius:6px;background:#e0262a;margin:2px 0 8px}
</style></head><body><div class="app">

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="pn" id="pn"></div></div>
<script>
var S={init:0,tx:[],notes:[]};
try{var raw=localStorage.getItem('expmgr');if(raw)S=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem('expmgr',JSON.stringify(S))}catch(e){}}
function fa(n){return Number(n).toLocaleString('fa-IR')}
function key(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
var $=function(i){return document.getElementById(i)};
var CAT={e:['خوراک','حمل‌ونقل','خرید','قبض','سلامت','سرگرمی','سایر'],i:['حقوق','فروش','هدیه','سایر']};
function sum(t,d){return S.tx.filter(function(x){return x.t===t&&(!d||x.date===d)}).reduce(function(a,x){return a+x.a},0)}
function render(){
 var td=key(new Date());$('exp').textContent=fa(sum('e',td));$('inc').textContent=fa(sum('i',td));$('bal').textContent=fa(S.init+sum('i')-sum('e'));
 var v=[],l=[];for(var k=0;k<7;k++){var d=new Date();d.setDate(d.getDate()-k);v.push(sum('e',key(d)));l.push(d.toLocaleDateString('fa-IR',{weekday:'long'}))}
 var mx=Math.max.apply(null,v.concat([1]));
 $('bars').innerHTML=v.map(function(x){var r=x/mx,c=r>.75?'#e5252a,#a30d12':r>.4?'#ffc61c,#e89200':'#3fd23f,#12801f';
  return '<div class="col"><span>'+(x?fa(Math.round(x/1000))+'k':'')+'</span><div class="bar" style="height:'+Math.max(r*135,8)+'px;background:linear-gradient('+c+')"></div></div>'}).join('');
 $('days').innerHTML=l.map(function(x){return '<div>'+x+'</div>'}).join('');}
function openSheet(h){$('pn').innerHTML=h+'<button class="btn" style="background:#444" onclick="closeSheet()">بستن</button>';$('sheet').classList.add('on')}
function closeSheet(){$('sheet').classList.remove('on')}
function openForm(t){openSheet('<h2>'+(t=='e'?'ثبت مخارج':'ثبت درآمد')+'</h2><input id="fa" type="number" inputmode="numeric" placeholder="مبلغ (تومان)"><select id="fc">'+CAT[t].map(function(c){return '<option>'+c+'</option>'}).join('')+'</select><input id="fn" placeholder="توضیحات (اختیاری)"><button class="btn" style="background:'+(t=='e'?'#1a9a26':'#1f58d8')+'" onclick="addTx(\''+t+'\')">ذخیره</button>')}
function addTx(t){var a=parseInt($('fa').value,10);if(!a||a<=0){$('fa').style.borderColor='#f33';return}
 S.tx.push({t:t,a:a,c:$('fc').value,n:$('fn').value,date:key(new Date()),id:Date.now()});save();render();closeSheet()}
function delTx(id){S.tx=S.tx.filter(function(x){return x.id!==id});save();render();openReports()}
function openReports(){var ym=key(new Date()).slice(0,7),by={},tot=0;
 S.tx.forEach(function(x){if(x.t=='e'&&x.date.slice(0,7)==ym){by[x.c]=(by[x.c]||0)+x.a;tot+=x.a}});
 var cs=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
 var h='<h2>گزارش‌ها</h2><div class="li"><span>مجموع درآمد</span><b class="pos">'+fa(sum('i'))+'</b></div><div class="li"><span>مجموع مخارج</span><b class="neg">'+fa(sum('e'))+'</b></div><h3>مخارج این ماه</h3>';
 h+=cs.length?cs.map(function(c){return '<div class="li"><span>'+c+'</span><b>'+fa(by[c])+'</b></div><div class="bar2" style="width:'+Math.round(by[c]/tot*100)+'%"></div>'}).join(''):'<p>هنوز هزینه‌ای ثبت نشده.</p>';
 h+='<h3>آخرین تراکنش‌ها</h3>';var la=S.tx.slice(-15).reverse();
 h+=la.length?la.map(function(x){return '<div class="li"><span>'+x.c+(x.n?' - '+esc(x.n):'')+'<small>'+new Date(x.date).toLocaleDateString('fa-IR')+'</small></span><span class="'+(x.t=='e'?'neg':'pos')+'">'+(x.t=='e'?'-':'+')+fa(x.a)+'</span><button class="x" onclick="delTx('+x.id+')">🗑</button></div>'}).join(''):'<p>تراکنشی وجود ندارد.</p>';openSheet(h)}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function openNotes(){openSheet('<h2>یادداشت‌ها</h2><textarea id="nt" rows="3" placeholder="یادداشت جدید..."></textarea><button class="btn" style="background:#e08a10" onclick="addNote()">افزودن</button>'+S.notes.map(function(n,i){return '<div class="li"><span>'+esc(n)+'</span><button class="x" onclick="delNote('+i+')">🗑</button></div>'}).join(''))}
function addNote(){var v=$('nt').value.trim();if(!v)return;S.notes.push(v);save();openNotes()}
function delNote(i){S.notes.splice(i,1);save();openNotes()}
function openSettings(){openSheet('<h2>تنظیمات</h2><label>موجودی اولیه حساب (تومان)</label><input id="si" type="number" inputmode="numeric" value="'+S.init+'"><button class="btn" style="background:#1a9aa8" onclick="S.init=parseInt($(\'si\').value,10)||0;save();render();closeSheet()">ذخیره</button><button class="btn" style="background:#a10c10" onclick="if(confirm(\'همه اطلاعات پاک شود؟\')){S={init:0,tx:[],notes:[]};save();render();closeSheet()}">پاک کردن همه اطلاعات</button>')}
render();
</script></body></html>
